# Project identification
# Update these with your SonarCloud organization and project key
# sonar.projectKey=your-org_your-portfolio
# sonar.organization=your-org

# Source configuration
sonar.sources=app
sonar.sourceEncoding=UTF-8
sonar.language=ts
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
sonar.exclusions=**/*.test.ts,**/*.spec.ts,node_modules/**,.next/**,public/**,**/*.config.ts,**/*.config.mjs,coverage/**,playwright-report/**

# Test configuration
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions — UI-only files that are not unit-tested
sonar.coverage.exclusions=app/components/**,app/**/page.tsx,app/**/layout.tsx,app/apple-icon.tsx

# Duplication exclusions — component and data files have intentional structural similarity
sonar.cpd.exclusions=app/components/**,app/data/**